<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parhai Companion — Challenge</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f8f4; color:#1c2b1c; margin:0; padding:24px; }
  .card { max-width:520px; margin:8vh auto; background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 6px 24px rgba(0,0,0,.08); text-align:center; }
  h1 { color:#1e7a34; font-size:24px; margin:0 0 8px; }
  p { line-height:1.55; margin:8px 0; }
  .btn { display:inline-block; margin-top:16px; background:#1e7a34; color:#fff; text-decoration:none; font-weight:600; padding:14px 22px; border-radius:999px; }
  .btn.secondary { background:#fff; color:#1e7a34; border:2px solid #1e7a34; margin-top:10px; }
  .small { font-size:13px; color:#5a6b5a; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎮 You've been challenged!</h1>
    <p>Someone invited you to a challenge in <strong>Parhai Companion</strong>.</p>
    <p><a class="btn" id="openApp" href="#">Open in Parhai Companion</a></p>
    <p class="small">Don't have the app yet?</p>
    <p><a class="btn secondary" href="https://play.google.com/apps/testing/com.shan.parhaicompanion">Get Parhai Companion</a></p>
    <p class="small">After installing, tap this challenge link again.</p>
  </div>
<script>
  // Carry the full challenge query (?type=...&data=...&cId=...) into the app's custom scheme.
  var appUrl = 'parhai://challenge' + window.location.search;
  document.getElementById('openApp').setAttribute('href', appUrl);
</script>
</body>
</html>
